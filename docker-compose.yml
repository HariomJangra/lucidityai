version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    ports:
      - "5173:5173"
    networks:
      - internal
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      # Pass through environment variables from the host's .env if needed
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - ./backend/.env
    networks:
      - internal
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    networks:
      - internal

networks:
  internal:
